# Fork workflow (jdburton91/fluxer): unsigned desktop builds that carry the fork's patches.
#
# Cut down from build-desktop.yaml: Linux x64 and Windows x64 only, no code signing, no macOS,
# no Velopack installer (Fluxer's packaging refuses to make one unsigned), and no module
# system, so the app always runs the web client built into it and never swaps in Fluxer's
# official one. Self-update is patched off in the shell (ShellUpdateCapability.ts).
#
# Runs on a pushed tag named desktop-<version>, for example desktop-2026.1111.200000, or by hand.
# The artifacts are attached to the run; publishing them as a release is a separate step.
name: jd desktop

on:
  push:
    tags:
      - "desktop-*"
  workflow_dispatch:
    inputs:
      build_version:
        description: Fluxer CalVer (YYYY.MDD.HHMMSS without leading zeroes). Empty means now.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: jd-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_CHANNEL: stable

jobs:
  meta:
    name: Resolve build metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.set.outputs.version }}
      source_sha: ${{ steps.set.outputs.source_sha }}
      pub_date: ${{ steps.set.outputs.pub_date }}
    steps:
      - name: Set metadata
        id: set
        env:
          INPUT_VERSION: ${{ inputs.build_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-}"
          if [ -z "$version" ] && [ "$REF_TYPE" = "tag" ]; then version="${REF_NAME#desktop-}"; fi
          if [ -z "$version" ]; then
            version="$(date -u +%Y).$((10#$(date -u +%m%d))).$((10#$(date -u +%H%M%S)))"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Building $version from $GITHUB_SHA"

  shared_assets:
    name: Build the web client for the desktop app
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ needs.meta.outputs.version }}
      SOURCE_SHA: ${{ needs.meta.outputs.source_sha }}
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.meta.outputs.source_sha }}
          path: _ci

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.meta.outputs.source_sha }}
          path: source

      - name: Set up Rust toolchain (renderer wasm)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown

      - name: Set workdir (Unix)
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_workdir_unix

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Set up pnpm
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step setup_pnpm

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_dependencies

      - name: Update version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_build_channel

      - name: Build shared renderer assets
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_shared_assets

      - name: Prepare shared renderer artifact
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step prepare_shared_assets

      - name: Upload shared renderer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-shared-${{ needs.meta.outputs.version }}
          path: source/desktop-shared-assets
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    name: Build ${{ matrix.platform }} (x64)
    needs:
      - meta
      - shared_assets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
          - platform: windows
            os: windows-2025
    env:
      BUILD_VERSION: ${{ needs.meta.outputs.version }}
      PUB_DATE: ${{ needs.meta.outputs.pub_date }}
      SOURCE_SHA: ${{ needs.meta.outputs.source_sha }}
      DESKTOP_PLATFORM: ${{ matrix.platform }}
      DESKTOP_ARCH: x64
      PLATFORM: ${{ matrix.platform }}
      ARCH: x64
      ELECTRON_ARCH: x64
    steps:
      - name: Checkout CI helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.meta.outputs.source_sha }}
          path: _ci

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.meta.outputs.source_sha }}
          path: source

      - name: Set up Rust toolchain (CI helpers)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"

      - name: Set up Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Ensure python3 command (Windows)
        if: runner.os == 'Windows'
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step ensure_python3_windows

      - name: Shorten Windows paths and pin pnpm store
        if: runner.os == 'Windows'
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step windows_paths
        env:
          SUBST_TARGET: ${{ github.workspace }}/source

      - name: Set workdir (Unix)
        if: runner.os != 'Windows'
        env:
          SUBST_TARGET: ${{ github.workspace }}/source
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_workdir_unix

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26

      - name: Set up pnpm
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step setup_pnpm

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_linux_deps

      - name: Set up Rust toolchain (Linux)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-gnu

      - name: Set up MSVC env (Windows)
        if: matrix.platform == 'windows'
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9
        with:
          arch: amd64

      - name: Set up Rust toolchain (Windows)
        if: matrix.platform == 'windows'
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_rust_windows_targets

      - name: Install dependencies
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step install_dependencies

      - name: Update version
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step update_version

      - name: Set build channel
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step set_build_channel

      - name: Download shared renderer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-shared-${{ needs.meta.outputs.version }}
          path: source/desktop-shared-assets

      - name: Restore shared renderer assets
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step restore_shared_assets

      # The CI helper's build_electron_main step forces FLUXER_MODULES=1. Run the same build
      # without it, so the module system is off and the bundled (patched) renderer is the app.
      - name: Build Electron main process (modules off)
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: bash
        env:
          NODE_ENV: production
          FLUXER_DESKTOP_PRODUCTION: "true"
        run: |
          set -euo pipefail
          unset FLUXER_MODULES
          pnpm build --use-shared-renderer
          node -e "const i=require('./dist/build-info.json'); console.log(i); if (i.modulesEnabled) process.exit(1)"

      - name: Build Electron app (Windows)
        if: matrix.platform == 'windows'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          TEMP: C:\t
          TMP: C:\t
          ELECTRON_BUILDER_CACHE: C:\ebcache
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_app_windows

      # Upstream's verify steps also wait for the module system's "served" log line, which a build
      # with modules off never writes. This runs the same release check and requires what matters
      # here: the window loads the bundled web client and reports this build's desktop and web
      # versions (and the shell keeps running until the check stops it).
      - name: Verify the packaged app boots its bundled web client (Windows)
        if: matrix.platform == 'windows'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: bash
        run: |
          set -uo pipefail
          out=$(node scripts/release-check.mjs --app 'dist-electron/win-unpacked' --channel stable \
            --expect-renderer "$BUILD_VERSION" --package-origin http://127.0.0.1:9 \
            --app-arg=--disable-gpu --timeout-seconds 60 2>&1) || true
          echo "$out"
          grep -qF "the window loads $BUILD_VERSION and reports Stable Desktop $BUILD_VERSION, Web $BUILD_VERSION" <<<"$out"

      - name: Create portable ZIP (Windows)
        if: matrix.platform == 'windows'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step create_portable_zip_windows

      - name: Download Fluxer's patched Electron (Linux)
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          GH_TOKEN: ${{ github.token }}
          FLUXER_ELECTRON_DIST: ${{ runner.temp }}/fluxer-electron-dist
        shell: bash
        run: |
          set -euo pipefail
          release_tag=$(jq -er .releaseTag electron/runtime.json)
          version=$(jq -er .electronVersion electron/runtime.json)
          gh release download "$release_tag" --repo fluxerapp/fluxer \
            --pattern "electron-v$version-linux-x64.zip" \
            --pattern "electron-v$version-linux-x64.fluxer.json" \
            --dir "$FLUXER_ELECTRON_DIST"

      - name: Build Electron app (Linux)
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        env:
          USE_SYSTEM_FPM: true
          FLUXER_ELECTRON_DIST: ${{ runner.temp }}/fluxer-electron-dist
        run: >-
          cargo run --locked --quiet --manifest-path ${{ github.workspace }}/_ci/tools/ci/Cargo.toml -- build-desktop
          --step build_app_linux

      - name: Verify the packaged app boots its bundled web client (Linux)
        if: matrix.platform == 'linux'
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: bash
        run: |
          set -uo pipefail
          out=$(xvfb-run -a node scripts/release-check.mjs --app dist-electron/linux-unpacked --channel stable \
            --expect-renderer "$BUILD_VERSION" --package-origin http://127.0.0.1:9 \
            --app-arg=--no-sandbox --app-arg=--disable-gpu --timeout-seconds 60 2>&1) || true
          echo "$out"
          grep -qF "the window loads $BUILD_VERSION and reports Stable Desktop $BUILD_VERSION, Web $BUILD_VERSION" <<<"$out"

      - name: Stage artifacts
        working-directory: ${{ env.WORKDIR }}/fluxer_desktop
        shell: bash
        run: |
          set -euo pipefail
          out="${{ github.workspace }}/out"
          mkdir -p "$out"
          if [ "${{ matrix.platform }}" = windows ]; then
            cp dist-electron/*-portable-win-x64.zip "$out"/
          else
            find dist-electron -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} "$out"/ \;
          fi
          cd "$out"
          ls -la
          test -n "$(ls)"
          sha256sum * > "SHA256SUMS-${{ matrix.platform }}.txt"
          cat "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fluxer-desktop-${{ matrix.platform }}-x64-${{ needs.meta.outputs.version }}
          path: out
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
